name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.22'

      - name: Build binaries
        run: make release

      - name: Verify binaries exist
        run: |
          echo "=== Built binaries ==="
          ls -lh dist/
          echo ""
          echo "=== Verifying binaries are executable ==="
          file dist/dx-asana-*

      - name: Calculate checksums
        run: |
          cd dist
          sha256sum dx-asana-darwin-amd64    > checksums.txt
          sha256sum dx-asana-darwin-arm64   >> checksums.txt
          sha256sum dx-asana-linux-amd64    >> checksums.txt
          sha256sum dx-asana-linux-arm64    >> checksums.txt
          sha256sum dx-asana-windows-amd64.exe >> checksums.txt
          echo ""
          echo "=== All checksums ==="
          cat checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/dx-asana-darwin-amd64
            dist/dx-asana-darwin-arm64
            dist/dx-asana-linux-amd64
            dist/dx-asana-linux-arm64
            dist/dx-asana-windows-amd64.exe
            dist/checksums.txt
          body: "Release ${{ github.ref_name }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
